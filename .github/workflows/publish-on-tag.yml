# GitHub Actions workflow for creating a new FoundryVTT module release.
#
# Useful References:
#   - https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#   - https://docs.github.com/en/actions/learn-github-actions/contexts
#   - https://docs.github.com/en/actions/learn-github-actions/environment-variables
#
# Troubleshooting Checklist:
#   - Is the module's manifest file valid JSON?
#     You can test your manifest file using https://jsonlint.com/.
#
#   - Does the module's manifest have all the required keys?
#     See https://foundryvtt.com/article/module-development/#manifest for more
#     information.
#
#   - Are all the proper files and directories being included in the release's
#     module archive ("module.zip")?
#     Check that the correct files are being passed to the `zip` command run
#     in the "Create Module Archive" step below.
#
#   - Is the release tag the proper format?
#     See the comments for the "Extract Version From Tag" step below.
#
#   - Is a GitHub release being published?
#     This workflow will only run when a release is published, not when a
#     release is updated. Furthermore, note that while a GitHub release will
#     (by default) create a repository tag, a repository tag will not create
#     or publish a GitHub release.
#
#   - Has the module's entry on FoundryVTT's module administration site
#     (https://foundryvtt.com/admin) been updated?
#
name: Create Module Files For GitHub Release


env:
  # The URL used for the module's "Project URL" link on FoundryVTT's website.
  project_url: "https://github.com/${{github.repository}}"

  # A URL that will always point to the latest manifest.
  release_manifest_url: "https://github.com/${{github.repository}}/releases/latest/download/module.json"

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  publish-module:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}

      - name: Extract Version and Tag
        id: get_version
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check & Tests
        run: |
          npm run typecheck
          npm test

      - name: Build Module
        run: npm run build

      # Modify "module.json" with values specific to the release.
      - name: Modify Module Manifest With Release-Specific Values
        env:
          REL_VERSION: ${{ steps.get_version.outputs.version }}
          PROJECT_URL: ${{ env.project_url }}
          MANIFEST_URL: ${{ env.release_manifest_url }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/module.zip"
        run: |
          node -e '
            const fs = require("fs");
            let manifest = fs.readFileSync("module.json", "utf8");
            manifest = manifest.replace(/#\{VERSION\}#/g, process.env.REL_VERSION);
            manifest = manifest.replace(/#\{URL\}#/g, process.env.PROJECT_URL);
            manifest = manifest.replace(/#\{MANIFEST\}#/g, process.env.MANIFEST_URL);
            manifest = manifest.replace(/#\{DOWNLOAD\}#/g, process.env.DOWNLOAD_URL);
            fs.writeFileSync("module.json", manifest);
          '

      - name: Validate Module Manifest
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            console.log("Validated manifest:", manifest.id, "version:", manifest.version);
            if (manifest.version.includes("#{")) {
              throw new Error("Version token was not replaced in module.json!");
            }
          '

      # Clean LevelDB lock and log files from compendiums before packing
      - name: Clean LevelDB lock files
        run: |
          rm -f packs/*/LOCK packs/*/LOG* packs/*/*.old 2>/dev/null || true

      # Create a "module.zip" archive containing all the module's required files.
      - name: Create Module Archive
        run: |
          zip -r ./module.zip \
            dist/ \
            templates/ \
            styles/ \
            lang/ \
            packs/ \
            src/ \
            LICENSE \
            README.md \
            module.json \
            -x "packs/*/LOCK" "packs/*/LOG*" "packs/*/*.old" "packs/*/lost/*"

      # Update the GitHub release with the manifest and module archive files.
      - name: Update Release With Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name || steps.get_version.outputs.tag }}
          draft: ${{ github.event.release.unpublished || false }}
          prerelease: ${{ github.event.release.prerelease || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ steps.get_version.outputs.tag }}
          body: ${{ github.event.release.body || '' }}
